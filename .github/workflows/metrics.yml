name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # 00:00 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

env:
  # PAT sem escopos, salvo em Settings > Secrets and variables > Actions > METRICS_TOKEN.
  # Sem o secret os passos são pulados e os SVGs commitados em assets/ continuam valendo.
  METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
  # O template classic é claro; isso troca para a paleta dark do GitHub + teal do perfil.
  METRICS_CSS: |
    svg{color:#c9d1d9}
    h1,h2,h3{color:#00bfbf}
    .field.language.details small{color:#8b949e}
    [fill="#ebedf0"]{fill:#161b22}
    [fill="#9be9a8"]{fill:#0b4f4f}
    [fill="#40c463"]{fill:#0f7d7d}
    [fill="#30a14e"]{fill:#14a8a8}
    [fill="#216e39"]{fill:#2ee6e6}

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Calendário isométrico de contribuições
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: ${{ env.METRICS_CSS }}

      - name: Linguagens mais usadas
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          extras_css: ${{ env.METRICS_CSS }}
